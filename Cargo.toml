[package]
name = "schafkopf-logic"
version = "0.0.0"
edition = "2024"
description = "Logic and rules for the Schafkopf card game: deck, suits, ranks and game modes."
license = "MIT"
readme = "README.md"
repository = "https://forgejo.heiserer.de/valentin/schafkopf-logic"
homepage = "https://forgejo.heiserer.de/valentin/schafkopf-logic"
keywords = ["schafkopf", "card-game", "trick-taking"]
categories = ["game-development"]
authors = ["Valentin Heiserer <valentin@heiserer.de>"]
exclude = ["shell.nix", "machine-learning/**", "games/**", "data/**"]

[dependencies]
sha2 = "0.10"
strum = "0.27"
strum_macros = "0.27"
rand = "0.9"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
flate2 = "1"
rayon = "1"
serde_json = "1"
